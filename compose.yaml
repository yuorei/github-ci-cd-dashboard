services:
  server:
    image: node:24
    working_dir: /app
    volumes:
      - ./server:/app
      - server_node_modules:/app/node_modules
      - server_wrangler:/app/.wrangler
    ports:
      - "8787:8787"
    environment:
      - HOME=/root
      - WRANGLER_SEND_METRICS=false
    command: >
      sh -c "npm install &&
             npx wrangler d1 migrations apply github-actions-dashboard --local &&
             npx wrangler dev --ip 0.0.0.0"
    # server/.dev.vars にGITHUB_TOKENなどを設定してください

  web:
    image: node:24
    working_dir: /app
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
      - web_wrangler:/app/.wrangler
    ports:
      - "5173:5173"
    environment:
      - HOME=/root
      - WRANGLER_SEND_METRICS=false
    command: >
      sh -c "npm install &&
             npm run dev"
    depends_on:
      - server

volumes:
  server_node_modules:
  server_wrangler:
  web_node_modules:
  web_wrangler:
